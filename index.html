<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Умный тренажёр · Подготовка</title>
<meta name="theme-color" content="#1e1e2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">🎓 Подготовка</div>
    <div class="top-search">
      <input id="topSearch" type="search" placeholder="🔍 Найти тему, урок или задачу…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" title="Тёмная/светлая тема">🌙</button>
      <button class="icon-btn" id="certBtn" title="Скачать сертификат">🎓</button>
    </div>
  </header>
  <div class="app-body">
    <aside class="sidebar">
      <nav id="nav">
        <button class="nav-btn active" data-view="home">🏠 План</button>
        <button class="nav-btn" data-view="turkce">🇹🇷 Турецкий</button>
        <button class="nav-btn" data-view="math">📐 Математика</button>
        <button class="nav-btn" data-view="inf">💻 Основы алгоритмизации · В057</button>
        <button class="nav-btn" data-view="burslari">🌍 Bursları (тест)</button>
        <button class="nav-btn" data-view="training">🔥 Тренировка</button>
        <button class="nav-btn" data-view="exam">🧪 Пробный ЕНТ</button>
        <button class="nav-btn" data-view="errors">❌ Ошибки</button>
      </nav>
      <div class="sidebar-foot">Сделано для тебя 🚀</div>
    </aside>

    <main class="content" id="content">
      <!-- контент подгружается из app.js -->
      <div class="loading">Загрузка…</div>
    </main>
  </div>
</div>

<div class="cert-modal" id="certModal">
  <div class="cert-box">
    <h2 style="margin-bottom:12px">🎓 Твой сертификат</h2>
    <canvas id="certCanvas"></canvas>
    <div class="cert-actions">
      <button class="btn" id="certDownload">⬇ Скачать PNG</button>
      <button class="btn ghost" id="certClose">Закрыть</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
