<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Умный тренажёр · Подготовка</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">🎓 Подготовка</div>
    <nav id="nav">
      <button class="nav-btn active" data-view="home">🏠 План</button>
      <button class="nav-btn" data-view="turkce">🇹🇷 Турецкий</button>
      <button class="nav-btn" data-view="math">📐 Математика</button>
      <button class="nav-btn" data-view="inf">💻 Основы алгоритмизации · В057</button>
      <button class="nav-btn" data-view="burslari">🌍 Bursları (тест)</button>
      <button class="nav-btn" data-view="training">🔥 Тренировка</button>
    </nav>
    <div class="sidebar-foot">Сделано для тебя 🚀</div>
  </aside>

  <main class="content" id="content">
    <!-- контент подгружается из app.js -->
    <div class="loading">Загрузка…</div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
