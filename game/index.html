<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#1e1e2e">
<title>Приключения Рыцаря</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1e1e2e; font-family:'Segoe UI',system-ui,sans-serif; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; touch-action:none; }
  #ui { position:fixed; top:10px; left:12px; color:#cdd6f4; font-size:16px; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,.7); pointer-events:none; z-index:5; line-height:1.4; }
  #ui b { color:#f9e2af; }
  #lives { color:#f38ba8; }
  #lvl { color:#a6adc8; font-size:13px; }
  #overlay { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(17,17,27,.88); color:#cdd6f4; z-index:10; text-align:center; padding:20px; }
  #overlay h1 { font-size:32px; color:#89b4fa; margin-bottom:10px; }
  #overlay p { font-size:17px; margin-bottom:18px; max-width:440px; line-height:1.45; }
  #diffRow { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
  .dbtn { font-size:15px; padding:10px 18px; border:2px solid #45475a; border-radius:10px; background:#313244; color:#cdd6f4; font-weight:600; cursor:pointer; }
  .dbtn.sel { border-color:#89b4fa; background:#45475a; color:#89b4fa; }
  #ovBtn { font-size:20px; padding:12px 34px; border:none; border-radius:10px; background:#89b4fa; color:#11111b; font-weight:700; cursor:pointer; }
  #ovBtn:hover { background:#a6d0ff; }
  .sub { font-size:14px; color:#a6adc8; margin-top:8px; }
  #touch { position:fixed; inset:0; pointer-events:none; z-index:4; display:none; }
  .tbtn { position:fixed; bottom:30px; width:76px; height:76px; border-radius:50%; background:rgba(137,180,250,.25); border:2px solid rgba(137,180,250,.55); color:#cdd6f4; font-size:30px; display:flex; align-items:center; justify-content:center; pointer-events:auto; user-select:none; touch-action:none; }
  #btnL { left:24px; }
  #btnR { left:112px; }
  #btnA { right:24px; background:rgba(166,227,161,.22); border-color:rgba(166,227,161,.55); color:#a6e3a1; font-size:26px; }
  #btnJ { right:112px; }
  .tbtn:active { background:rgba(137,180,250,.5); }
  @media (pointer:coarse) { #touch { display:block; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">⭐ <b id="score">0</b> &nbsp; ❤️ <span id="lives">3</span><br><span id="lvl"></span></div>
<div id="touch">
  <div class="tbtn" id="btnL">◀</div>
  <div class="tbtn" id="btnR">▶</div>
  <div class="tbtn" id="btnA">⚔️</div>
  <div class="tbtn" id="btnJ">⬆</div>
</div>
<div id="overlay">
  <h1 id="ovTitle">Приключения Рыцаря</h1>
  <p id="ovText">Собери звёзды и доберись до флага!</p>
  <div id="diffRow">
    <button class="dbtn" data-diff="easy">🟢 Лёгкая</button>
    <button class="dbtn sel" data-diff="normal">🟡 Средняя</button>
    <button class="dbtn" data-diff="hard">🔴 Сложная</button>
  </div>
  <button id="ovBtn">▶ Играть</button>
  <div class="sub" id="ovSub"></div>
</div>
<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const UI = { score: document.getElementById("score"), lives: document.getElementById("lives"),
             lvl: document.getElementById("lvl") };
const OV = { el: document.getElementById("overlay"), title: document.getElementById("ovTitle"),
              text: document.getElementById("ovText"), btn: document.getElementById("ovBtn"),
              sub: document.getElementById("ovSub") };

// ---------- УРОВНИ ----------
const ROWS = 14, COLS = 60;
const LEVELS = [
  {
    name: "🍃 Лес",
    map: [
      "............................................................",
      "............................................................",
      "................CC.................................CC.......",
      "...............####...............................####......",
      "............................................................",
      ".....CC....................CC..........CC...................",
      "....####..................####........####..................",
      "............................................................",
      "..........CC..........CC.......E..CC.......E..CC............",
      "........#####....#..#####.......#####.......#####..#........",
      ".................#................#................#........",
      "..P...........E..#........E...CC..#...E...CC......E#..CC.F..",
      "############################################################",
      "############################################################",
    ],
    theme: { sky:["#11111b","#313244","#45475a"], grass:"#a6e3a1", soil:"#585b70", deco:"#89dceb", stars:true }
  },
  {
    name: "🏜 Пустыня",
    map: [
      "............................................................",
      "............................................................",
      "............................................................",
      "................CC.......................CC.................",
      "...............####.....................####................",
      "............................................................",
      ".......CC............CC..............CC..............CC.....",
      "......####..........####............####............####....",
      "............................................................",
      "........E....#CC.............CC#.E.......E...CC..#..........",
      "............#####...........#####...........######..........",
      "..P.......E..#..........ECC....#.CCE.............ECC...CCF..",
      "############################################################",
      "############################################################",
    ],
    theme: { sky:["#2b1408","#4a2510","#6d3a1a"], grass:"#f9e2af", soil:"#a97b4a", deco:"#f38ba8", stars:false }
  },
  {
    name: "❄️ Ледяные пещеры",
    map: [
      "............................................................",
      ".......C...................C...................C............",
      "......###.................###.................###...........",
      "............................................................",
      "...........C.........C.........C.........C.........C........",
      "..........###.......###.......###.......###.......###.......",
      "............................................................",
      ".....C.........C.........C.........C.........C.........C....",
      "....###......####.......###......####.......###......####...",
      ".............#...................#...................#......",
      ".......E.C...#...E.C.......E.C...#...E.C.......E.C...#......",
      "..P.....###.EC....###.EC....###.EC....###.EC....###.EC...F..",
      "############################################################",
      "############################################################",
    ],
    theme: { sky:["#0f1a2b","#1e3a5f","#2e4a6d"], grass:"#89dceb", soil:"#5c7a9c", deco:"#a6e3a1", stars:true }
  },
];

// ---------- СЛОЖНОСТЬ ----------
const DIFF = {
  easy:   { lives:5, speed:0.008, name:"Лёгкая" },
  normal: { lives:3, speed:0.012, name:"Средняя" },
  hard:   { lives:2, speed:0.018, name:"Сложная" },
};

// ---------- Состояние ----------
let S = { score:0, lives:3, running:false, particles:[], camShake:0, time:0, won:false,
          level:0, diff:"normal", swing:0 };
let KEYS = {};
let coins=[], ENEMIES=[], P={}, flag={};

function buildMap(){
  const map = LEVELS[S.level].map;
  const tiles = Array.from({length:ROWS}, () => Array(COLS).fill(0));
  const cl = [], en = [];
  let spawn = {x:2,y:11}, fl = {x:COLS-2,y:ROWS-2};
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const ch = map[r][c];
      if(ch==="#") tiles[r][c]=1;
      else if(ch==="C") cl.push({x:c,y:r,taken:false});
      else if(ch==="E") en.push({x:c,y:r});
      else if(ch==="P") spawn = {x:c,y:r};
      else if(ch==="F") fl = {x:c,y:r};
    }
  }
  return {tiles,coins:cl,enemies:en,spawn,flag:fl};
}
function solAt(c,r){ const m=LEVELS[S.level].map; return r>=0 && r<ROWS && c>=0 && c<COLS && m[r][c]==="#"; }

// ---------- Камера ----------
let tile=32, W=0, H=0, cam=0;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W; cv.height = H;
}

// ---------- Звук ----------
let AC=null;
function beep(freq, dur=0.08, type="square", vol=0.04){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

// ---------- Частицы ----------
function puff(x,y,color,n=14,spd=3){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (0.4+Math.random()*spd)*tile*0.03;
    S.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,g:0.12*tile*0.01,life:0.5+Math.random()*0.4,t:0,color});
  }
}
function coinBurst(x,y){
  for(let i=0;i<18;i++){
    const a = Math.random()*Math.PI*2, v = (0.5+Math.random()*2.2)*tile*0.03;
    S.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0.1*tile*0.01,life:0.4+Math.random()*0.35,t:0,color:Math.random()<0.7?"#f9e2af":"#f38ba8"});
  }
}

// ---------- Физика ----------
function rectsRect(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function collideBox(ent){
  const x0=Math.floor(ent.x), x1=Math.floor(ent.x+ent.w), y0=Math.floor(ent.y), y1=Math.floor(ent.y+ent.h);
  for(let r=y0;r<=y1;r++) for(let c=x0;c<=x1;c++) if(solAt(c,r)) return true;
  return false;
}
function moveEntity(e, dx, dy){
  e.x += dx; if(collideBox(e)) e.x -= dx;
  e.y += dy; if(collideBox(e)){ e.y -= dy; e.onGround = dy>0; return false; }
  return true;
}

// ---------- Враги ----------
function resetEnemies(list){
  ENEMIES.length=0;
  for(const e of list) ENEMIES.push({x:e.x, y:e.y, w:0.7, h:0.6, dir:1, speed:DIFF[S.diff].speed,
    alive:true, anim:Math.random()*10, hp:2, state:"patrol", atkCd:0, flash:0, kb:0, kbDir:1});
}
function updateEnemies(dt){
  for(const e of ENEMIES){
    if(!e.alive) continue;
    e.anim += dt;
    e.flash = Math.max(0, e.flash - dt);
    e.atkCd = Math.max(0, e.atkCd - dt);
    const p = P;
    const distX = Math.abs(p.x - e.x);
    const distY = Math.abs((p.y+p.h) - (e.y+e.h));
    if(e.state==="patrol" && distX < 6 && distY < 2.5) e.state = "attack";
    if(e.state==="attack" && distX > 9) e.state = "patrol";
    const base = e.speed * tile * 60 * dt;
    const spd = base * (e.state==="attack" ? 1.12 : 1);
    let vx = 0;
    if(e.state==="patrol"){
      vx = e.dir * spd;
    } else {
      vx = Math.sign(p.x - e.x) * spd;
      if(vx!==0) e.dir = vx>0?1:-1;
    }
    const prevOn = e.onGround;
    e.onGround = false;
    if(!moveEntity(e, vx, 0)){ if(e.state==="patrol") e.dir *= -1; }
    if(e.kb>0){
      e.kb -= dt;
      moveEntity(e, e.kbDir * 0.2 * tile * 60 * dt, 0);
    }
    moveEntity(e, 0, 0.012 * tile);
    e.x = Math.max(0.05, Math.min(COLS-1-e.w, e.x));
    if(!prevOn && e.onGround) puff(e.x+e.w/2, e.y+e.h, "rgba(166,227,161,.35)", 4, 1);
    // враг атакует игрока (по дистанции)
    if(e.state==="attack" && !P.dead){
      const hitDist = Math.abs((p.x+p.w/2) - (e.x+e.w/2));
      const hitY = Math.abs((p.y+p.h) - (e.y+e.h));
      if(hitDist < 1.3 && hitY < 1.5){
        if(e.atkCd<=0){ e.atkCd = 1.1; hitPlayer(); }
        // упираемся в игрока, не проходим сквозь
        e.x = p.x + (e.dir>0 ? -e.w-0.05 : p.w+0.05);
      }
    }
  }
}
// игрок атакует мечом
function tryAttack(){
  if(S.swing>0 || !S.running || P.dead) return;
  S.swing = 0.32;
  beep(260,0.08,"square",0.05);
  const cx = P.x + P.w/2 + P.dir*0.75;
  const cy = P.y + P.h*0.45;
  for(const e of ENEMIES){
    if(!e.alive) continue;
    const ex = e.x+e.w/2, ey = e.y+e.h/2;
    if(Math.abs(ex-cx) < 1.0 && Math.abs(ey-cy) < 1.25){
      e.hp--; e.flash = 0.25;
      e.kbDir = Math.sign(ex - P.x) || P.dir;
      e.kb = 0.3;
      if(e.hp <= 0){
        e.alive = false;
        S.score += 25;
        puff(ex*tile, ey*tile, "rgba(243,139,168,.95)", 22, 3.4);
        beep(180,0.18,"sawtooth",0.07);
      } else {
        beep(320,0.1,"square",0.06);
        puff(ex*tile, ey*tile, "rgba(249,226,175,.9)", 10, 2.2);
      }
    }
  }
}

// ---------- Обновление ----------
function update(dt){
  S.time += dt;
  let ax = 0;
  if(KEYS["ArrowLeft"]||KEYS["KeyA"]) ax -= 1;
  if(KEYS["ArrowRight"]||KEYS["KeyD"]) ax += 1;
  const jump = KEYS["ArrowUp"]||KEYS["Space"]||KEYS["KeyW"];
  if(ax!==0) P.dir = ax>0?1:-1;
  if(KEYS["KeyX"]||KEYS["KeyF"]||KEYS["KeyJ"]) tryAttack();
  S.swing = Math.max(0, S.swing - dt);
  const accel = 0.05*tile, maxV = 0.24*tile, fric = 0.82;
  P.vx += ax*accel*60*dt;
  if(ax===0 && P.onGround) P.vx *= Math.pow(fric, 60*dt);
  P.vx = Math.max(-maxV, Math.min(maxV, P.vx));
  if(P.onGround && jump){ P.vy = -0.52*tile; P.onGround=false; puff(P.x+P.w/2, P.y+P.h, "rgba(166,227,161,.4)",10,1.6); beep(320,0.06,"triangle"); }
  P.vy += 0.022*tile*60*dt;
  P.vy = Math.min(P.vy, 1.1*tile);
  const wasGround = P.onGround;
  P.onGround = false;
  if(!P.dead){
    moveEntity(P, P.vx*dt, 0);
    moveEntity(P, 0, P.vy*dt);
  }
  P.x = Math.max(0, Math.min(COLS - P.w, P.x));
  P.y = Math.max(0, Math.min(ROWS - P.h, P.y));
  if(!wasGround && P.onGround){ P.vy=0; puff(P.x+P.w/2, P.y+P.h, "rgba(137,180,250,.3)",8,1.2); }
  if(Math.abs(P.vx)>1) P.anim += dt*10; else if(!P.onGround) P.anim = 0.5;

  for(const c of coins){
    if(c.taken) continue;
    if(rectsRect(P, {x:c.x+0.15,y:c.y+0.15,w:0.7,h:0.7})){
      c.taken = true; S.score += 10;
      coinBurst((c.x+0.5)*tile, (c.y+0.5)*tile);
      beep(880,0.09,"triangle",0.05); beep(1320,0.09,"triangle",0.04);
    }
  }
  updateEnemies(dt);
  if(!P.dead){
    for(const e of ENEMIES){
      if(!e.alive) continue;
      if(rectsRect(P,{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(P.vy > 0.15*tile && P.y+P.h < e.y+e.h*0.55){
          e.alive=false; S.score += 25;
          puff(e.x+e.w/2, e.y+e.h/2, "rgba(243,139,168,.9)",20,3);
          P.vy = -0.45*tile; beep(200,0.15,"sawtooth",0.06);
        } else hitPlayer();
      }
    }
  }
  if(!S.won && rectsRect(P, {x:flag.x+0.15,y:flag.y+0.15,w:0.7,h:0.7})){
    completeLevel();
  }
  for(let i=S.particles.length-1;i>=0;i--){
    const p = S.particles[i];
    p.t += dt; p.vy += p.g*60*dt; p.x += p.vx*60*dt; p.y += p.vy*60*dt;
    if(p.t >= p.life) S.particles.splice(i,1);
  }
  S.camShake = Math.max(0, S.camShake - dt*2.5);
  const target = P.x+P.w/2 - W/(2*tile);
  cam += (target - cam) * Math.min(1, dt*8);
  const maxCam = Math.max(0, COLS - W/tile);
  cam = Math.max(0, Math.min(maxCam, cam));
}

function hitPlayer(){
  if(P.inv>0 || P.dead) return;
  S.lives--; UI.lives.textContent = Math.max(0,S.lives);
  P.inv = 1.5; S.camShake = 0.5;
  beep(110,0.25,"sawtooth",0.08);
  puff(P.x+P.w/2, P.y+P.h/2, "rgba(243,139,168,.8)",24,3);
  if(S.lives <= 0){
    P.dead = true;
    OV.title.textContent = "💀 Игра окончена";
    OV.text.textContent = "Набрано очков: " + S.score + ". Попробуй ещё раз!";
    OV.btn.textContent = "🔄 Заново";
    OV.btn.onclick = startGame;
    OV.sub.textContent = "";
    OV.el.style.display = "flex";
  }
}

function nextLevel(){
  S.level++;
  loadLevel();
}

function completeLevel(){
  S.won = true; S.running = false;
  beep(523,0.15,"triangle",0.06); setTimeout(()=>beep(659,0.15,"triangle",0.06),150);
  setTimeout(()=>beep(784,0.25,"triangle",0.06),300);
  if(S.level + 1 < LEVELS.length){
    OV.title.textContent = "✅ Уровень пройден!";
    OV.text.textContent = LEVELS[S.level].name + " позади. Счёт: " + S.score + ".";
    OV.btn.textContent = "Дальше → " + LEVELS[S.level+1].name;
    OV.btn.onclick = nextLevel;
  } else {
    OV.title.textContent = "🏆 Победа!";
    OV.text.textContent = "Ты прошёл все уровни! Итоговый счёт: " + S.score + ".";
    OV.btn.textContent = "🔄 Играть заново";
    OV.btn.onclick = startGame;
  }
  OV.sub.textContent = "";
  OV.el.style.display = "flex";
}

// ---------- Рендер ----------
function rRect(x,y,w,h,color){ ctx.fillStyle = color; ctx.fillRect(x,y,w,h); }
function drawTile(c,r){
  const th = LEVELS[S.level].theme;
  const x = (c-cam)*tile, y = r*tile;
  rRect(x, y, tile, tile, "#45475a");
  rRect(x+2, y+2, tile-4, tile-4, th.soil);
  const g = tile*0.22;
  rRect(x, y, tile, g, th.grass);
  rRect(x, y+tile-g, tile, 3, th.deco);
  ctx.fillStyle = "rgba(0,0,0,.12)";
  ctx.fillRect(x+4, y+10, 6, 4); ctx.fillRect(x+tile-12, y+tile-14, 6, 4);
}
function drawForeground(c,r){
  const x = (c-cam)*tile, y = r*tile;
  if((r+c)%7===0){
    const cx = x+tile/2, cy = y+tile/2;
    ctx.strokeStyle="#a6adc8"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy+6); ctx.lineTo(cx,cy); ctx.stroke();
    ctx.fillStyle="#f38ba8"; ctx.beginPath(); ctx.arc(cx,cy,4,0,7); ctx.fill();
    ctx.fillStyle="#f9e2af"; ctx.beginPath(); ctx.arc(cx,cy,1.8,0,7); ctx.fill();
  }
}
function drawCoin(c){
  const x = (c.x-cam)*tile, y = c.y*tile;
  const cx = x+tile/2, cy = y+tile/2;
  const pulse = 0.75 + 0.25*Math.sin(S.time*5);
  ctx.save(); ctx.translate(cx,cy); ctx.scale(pulse,1);
  ctx.fillStyle="#f9e2af"; ctx.beginPath(); ctx.arc(0,0,tile*0.28,0,7); ctx.fill();
  ctx.fillStyle="#f5c96b"; ctx.beginPath(); ctx.arc(0,0,tile*0.19,0,7); ctx.fill();
  ctx.fillStyle="#f9e2af"; ctx.font="bold "+(tile*0.28)+"px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("★",0,1);
  ctx.restore();
}
function drawEnemy(e){
  if(!e.alive) return;
  const x = (e.x-cam)*tile, y = e.y*tile, w = e.w*tile, h = e.h*tile;
  const wob = Math.sin(e.anim*8)*2;
  const attacking = e.state==="attack";
  // тело слизня с градиентом
  const g = ctx.createLinearGradient(0, y, 0, y+h);
  g.addColorStop(0, "#f38ba8");
  g.addColorStop(1, "#b5526e");
  ctx.fillStyle = e.flash>0 ? "#ffffff" : g;
  ctx.beginPath();
  ctx.moveTo(x+3, y+h-4);
  ctx.quadraticCurveTo(x+3, y+wob+6, x+w/2, y+6);
  ctx.quadraticCurveTo(x+w-3, y+wob+6, x+w-3, y+h-4);
  ctx.closePath(); ctx.fill();
  // шипы на спине
  ctx.fillStyle = e.flash>0 ? "#eee" : "#e06c8b";
  for(let i=0;i<3;i++){
    const sx = x + w*(0.25+0.25*i);
    ctx.beginPath();
    ctx.moveTo(sx-6, y+h-6);
    ctx.lineTo(sx, y+h-18 - (attacking?4:0));
    ctx.lineTo(sx+6, y+h-6);
    ctx.closePath(); ctx.fill();
  }
  // глаза: злые (красные при атаке)
  ctx.fillStyle = attacking ? "#f9e2af" : "#11111b";
  ctx.beginPath(); ctx.arc(x+w*0.32, y+h*0.38, 3.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*0.68, y+h*0.38, 3.5, 0, 7); ctx.fill();
  // HP-бар (если ранен)
  if(e.hp < 2){
    ctx.fillStyle = "rgba(17,17,27,.6)";
    ctx.fillRect(x+4, y-8, w-8, 4);
    ctx.fillStyle = "#a6e3a1";
    ctx.fillRect(x+4, y-8, (w-8)*(e.hp/2), 4);
  }
}
function drawPlayer(){
  if(!P.h) return;
  if(P.inv>0 && Math.floor(P.inv*12)%2===0 && !P.dead) return;
  const x = (P.x-cam)*tile, y = P.y*tile, w = P.w*tile, h = P.h*tile;
  ctx.save(); ctx.translate(x+w/2, y+h);
  const run = P.onGround ? Math.sin(P.anim*2)*3 : 0;
  ctx.scale(P.dir, 1);
  if(P.dead){
    ctx.globalAlpha = 0.5;
    ctx.rotate(-Math.PI/2);
  }
  // ноги (шаг)
  ctx.fillStyle="#45475a";
  ctx.fillRect(-w*0.30, -h*0.22 + run*0.3, w*0.18, h*0.22);
  ctx.fillRect(w*0.12, -h*0.22 - run*0.3, w*0.18, h*0.22);
  // тело
  const tg = ctx.createLinearGradient(0, -h, 0, 0);
  tg.addColorStop(0, "#89b4fa"); tg.addColorStop(1, "#5f84d8");
  ctx.fillStyle = tg;
  ctx.fillRect(-w*0.32, -h*0.85, w*0.64, h*0.66);
  // пояс
  ctx.fillStyle="#45475a";
  ctx.fillRect(-w*0.32, -h*0.42, w*0.64, h*0.10);
  // голова
  ctx.fillStyle="#f5e0dc";
  ctx.beginPath(); ctx.arc(0, -h*0.95, w*0.28, 0, 7); ctx.fill();
  ctx.fillStyle="#11111b";
  ctx.beginPath(); ctx.arc(w*0.12, -h*0.98, 2.5, 0, 7); ctx.fill();
  // шлем
  ctx.fillStyle="#7287fd";
  ctx.beginPath();
  ctx.moveTo(-w*0.34, -h*0.95);
  ctx.quadraticCurveTo(0, -h*1.25, w*0.34, -h*0.95);
  ctx.closePath(); ctx.fill();
  // меч (рука + клинок)
  const sw = S.swing;
  ctx.save();
  ctx.translate(w*0.38, -h*0.62);
  if(sw>0){
    const a = (1 - sw/0.32)*Math.PI*1.2 - Math.PI*0.55;
    ctx.rotate(a);
    ctx.globalAlpha = Math.min(1, sw/0.32*2.5);
    ctx.strokeStyle = "#f9e2af";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0,0, w*0.9, -0.7, 0.7); ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ctx.rotate(-0.7);
  }
  // рука
  ctx.fillStyle="#f5e0dc";
  ctx.fillRect(-2, -2, w*0.22, 4);
  // клинок
  ctx.fillStyle="#cdd6f4";
  ctx.fillRect(0, -1.5, w*1.15, 3);
  ctx.fillStyle="#a6e3a1";
  ctx.fillRect(w*1.15, -1.5, w*0.12, 3);
  ctx.restore();
  ctx.restore();
}
function drawFlag(){
  const x = (flag.x-cam)*tile, y = flag.y*tile;
  ctx.fillStyle="#45475a"; ctx.fillRect(x+6, y+tile*0.2, 4, tile*0.8);
  const wave = Math.sin(S.time*4)*3;
  ctx.fillStyle="#a6e3a1";
  ctx.beginPath(); ctx.moveTo(x+10,y+tile*0.2); ctx.lineTo(x+34, y+tile*0.2+wave); ctx.lineTo(x+10, y+tile*0.42+wave); ctx.closePath(); ctx.fill();
}
function drawParallax(){
  const th = LEVELS[S.level].theme;
  const w=W, h=H;
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,th.sky[0]); grad.addColorStop(0.5,th.sky[1]); grad.addColorStop(1,th.sky[2]);
  ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
  if(th.stars){
    for(let i=0;i<40;i++){
      const sx = (i*137.5 - cam*tile*0.1) % (w+20);
      const sy = (i*73.7) % (h*0.5);
      const tw = 0.4+0.6*Math.abs(Math.sin(S.time*1.5+i));
      ctx.fillStyle = "rgba(205,214,244,"+tw*0.5+")";
      ctx.fillRect(sx<0?sx+w:sx, sy, 2, 2);
    }
  }
  ctx.fillStyle="#1e1e2e";
  ctx.beginPath(); ctx.moveTo(0,h*0.7);
  for(let x=0;x<=w;x+=24){
    const yy = h*0.7 - Math.sin(x*0.008 - cam*tile*0.15)*60 - Math.sin(x*0.02)*25;
    ctx.lineTo(x,yy);
  }
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#24273a";
  ctx.beginPath(); ctx.moveTo(0,h*0.82);
  for(let x=0;x<=w;x+=18){
    const yy = h*0.82 - Math.sin(x*0.014 - cam*tile*0.3)*45;
    ctx.lineTo(x,yy);
  }
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();
}
function render(){
  ctx.save();
  if(S.camShake>0) ctx.translate((Math.random()-0.5)*S.camShake*10, (Math.random()-0.5)*S.camShake*10);
  drawParallax();
  const c0 = Math.max(0, Math.floor(cam)-1), c1 = Math.min(COLS-1, Math.ceil(cam+W/tile)+1);
  const map = LEVELS[S.level].map;
  for(let r=0;r<ROWS;r++){
    for(let c=c0;c<=c1;c++) if(map[r][c]==="#") drawTile(c,r);
  }
  for(let r=0;r<ROWS;r++){
    for(let c=c0;c<=c1;c++) if(map[r][c]==="." || map[r][c]==="P") drawForeground(c,r);
  }
  drawFlag();
  for(const c of coins) if(!c.taken) drawCoin(c);
  for(const e of ENEMIES) drawEnemy(e);
  drawPlayer();
  for(const p of S.particles){
    const a = 1 - p.t/p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- Запуск ----------
function loadLevel(){
  const d = buildMap();
  coins.length = 0; coins.push(...d.coins);
  resetEnemies(d.enemies);
  P = { x:d.spawn.x, y:d.spawn.y, vx:0, vy:0, w:0.7, h:0.85, onGround:false, dir:1, anim:0, dead:false, inv:0 };
  flag = d.flag;
  S.won = false; S.particles.length = 0; S.camShake = 0;
  cam = 0;
  UI.lvl.textContent = "📜 " + LEVELS[S.level].name + " · " + DIFF[S.diff].name;
  OV.el.style.display = "none";
  S.running = true;
}
function startGame(){
  S.level = 0;
  S.score = 0;
  S.lives = DIFF[S.diff].lives;
  UI.score.textContent = "0"; UI.lives.textContent = S.lives;
  loadLevel();
}
function selectDiff(key){
  S.diff = key;
  document.querySelectorAll(".dbtn").forEach(b => b.classList.toggle("sel", b.dataset.diff===key));
  OV.sub.textContent = DIFF[key].name + ": " + DIFF[key].lives + " ❤️, враги — скорость " + (DIFF[key].speed*1000|0) + "";
}

// ---------- Основной цикл ----------
let last = 0;
function loop(ts){
  const dt = Math.min(0.033, (ts-last)/1000 || 0.016);
  last = ts;
  if(S.running) update(dt);
  render();
  requestAnimationFrame(loop);
}

// ---------- Ввод ----------
window.addEventListener("keydown", e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD","KeyW"].includes(e.code)) e.preventDefault();
  KEYS[e.code] = true;
});
window.addEventListener("keyup", e=>{ KEYS[e.code] = false; });
function bindTouch(id, code){
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); KEYS[code]=true; };
  const up = e => { e.preventDefault(); KEYS[code]=false; };
  el.addEventListener("touchstart", down, {passive:false});
  el.addEventListener("touchend", up, {passive:false});
  el.addEventListener("touchcancel", up, {passive:false});
  el.addEventListener("mousedown", down);
  el.addEventListener("mouseup", up);
  el.addEventListener("mouseleave", up);
}
bindTouch("btnL","ArrowLeft"); bindTouch("btnR","ArrowRight"); bindTouch("btnA","KeyX"); bindTouch("btnJ","ArrowUp");

document.querySelectorAll(".dbtn").forEach(b => b.addEventListener("click", ()=>selectDiff(b.dataset.diff)));
window.addEventListener("resize", ()=>{ resize(); });

resize();
selectDiff("normal");
OV.title.textContent = "Приключения Рыцаря";
OV.text.textContent = "Собери звёзды и доберись до флага. ПК: ←→/AD — бег, ↑/пробел — прыжок, X/F/J — меч. На телефоне — кнопки на экране.";
OV.btn.textContent = "▶ Играть";
OV.btn.onclick = startGame;
OV.el.style.display = "flex";
requestAnimationFrame(loop);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
