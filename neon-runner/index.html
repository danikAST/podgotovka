<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Неоновый бегун PRO</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05050e; font-family:'Segoe UI',Arial,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { position:relative; width:420px; height:100%; max-height:900px; background:#0a0d1a; overflow:hidden;
          box-shadow:0 0 80px rgba(90,70,255,.35); }
  #game:after { content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 30%, transparent 55%, rgba(5,5,14,.55) 100%); }
  canvas { position:absolute; inset:0; }
  #hud { position:absolute; top:12px; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:0 16px; z-index:6; font-size:13px; color:#9aa4e8; letter-spacing:1px; text-transform:uppercase; font-weight:700; }
  #hud .lbl { opacity:.75; }
  #hud b { display:block; color:#fff; font-size:22px; letter-spacing:0; text-shadow:0 0 14px rgba(120,160,255,.8); margin-top:1px; }
  #hud .right { text-align:right; }
  #speedWrap { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:6; text-align:center; }
  #speedWrap .lbl { font-size:10px; color:#6a74b8; letter-spacing:2px; }
  #speedBar { width:110px; height:4px; background:rgba(255,255,255,.08); border-radius:2px; margin-top:4px; overflow:hidden; }
  #speedFill { height:100%; width:0%; background:linear-gradient(90deg,#3cd7ff,#8a5cff); border-radius:2px; }
  #lives { position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:6; font-size:16px; letter-spacing:4px; }
  #combo { position:absolute; top:96px; left:0; right:0; text-align:center; z-index:6; font-size:18px; color:#ffd75e;
    text-shadow:0 0 16px rgba(255,215,94,.9); font-weight:800; opacity:0; transition:opacity .15s, transform .15s; }
  #combo.shine { transform:scale(1.15); }
  .overlay { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(6,6,16,.86); backdrop-filter:blur(10px); text-align:center; padding:26px; }
  .overlay.hidden { display:none; }
  h1 { font-size:40px; background:linear-gradient(135deg,#8a5cff 0%,#3cd7ff 50%,#ffd75e 100%); -webkit-background-clip:text; background-clip:text;
    color:transparent; margin-bottom:6px; letter-spacing:3px; filter:drop-shadow(0 0 18px rgba(100,120,255,.35)); }
  .sub { color:#878fbd; font-size:14px; max-width:300px; line-height:1.5; margin-bottom:20px; }
  .btn { padding:16px 46px; border:none; border-radius:16px; font-size:19px; font-weight:800; color:#05050e; cursor:pointer;
    background:linear-gradient(135deg,#3cd7ff,#8a5cff); box-shadow:0 8px 36px rgba(80,120,255,.5); transition:transform .15s; }
  .btn:active { transform:scale(.93); }
  .row { display:flex; gap:12px; margin-top:16px; }
  .k { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:10px 14px;
    color:#9aa4e8; font-size:12px; min-width:96px; }
  .k b { color:#fff; display:block; font-size:16px; margin-bottom:3px; letter-spacing:1px; }
  #final { font-size:32px; color:#fff; margin-bottom:6px; text-shadow:0 0 20px rgba(255,90,120,.6); }
  #finalSub { color:#878fbd; margin-bottom:22px; font-size:16px; }
  #rec { color:#ffd75e; font-size:16px; margin-top:12px; text-shadow:0 0 12px rgba(255,215,94,.6); }
  #mute { position:absolute; top:64px; right:14px; z-index:8; background:none; border:1px solid rgba(255,255,255,.18);
    color:#9aa4e8; font-size:15px; width:34px; height:34px; border-radius:10px; cursor:pointer; backdrop-filter:blur(4px); }
  #touch { position:absolute; inset:0; z-index:7; }
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <canvas id="cv"></canvas>
  <div id="touch"></div>
  <button id="mute" title="Звук">🔊</button>
  <div id="hud">
    <div><span class="lbl">Очки</span><b id="score">0</b></div>
    <div id="speedWrap"><span class="lbl">Скорость</span><div id="speedBar"><div id="speedFill"></div></div></div>
    <div class="right"><span class="lbl">Рекорд</span><b id="best">0</b></div>
  </div>
  <div id="lives">❤️❤️❤️</div>
  <div id="combo"></div>
  <div id="startScreen" class="overlay">
    <h1>NEON RUNNER <span style="color:#ffd75e;background:none;-webkit-text-fill-color:#ffd75e">PRO</span></h1>
    <div class="sub">Город спит — ты бежишь. Прыгай через стены, скользи под лазерами и собирай энергию.</div>
    <div class="row">
      <div class="k"><b>◀ ▶</b>дорожки</div>
      <div class="k"><b>▲</b>прыжок</div>
      <div class="k"><b>▼</b>скольжение</div>
    </div>
    <button class="btn" id="startBtn" style="margin-top:24px">НАЧАТЬ БЕГ</button>
  </div>
  <div id="overScreen" class="overlay hidden">
    <div id="final">💥 Разбился!</div>
    <div id="finalSub">Дистанция: 0 м</div>
    <button class="btn" id="restartBtn">БЕЖАТЬ СНОВА</button>
    <div id="rec"></div>
  </div>
</div></div>
<script>
(function(){
"use strict";
// ========== БАЗА ==========
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=420,VIEWH=900;
function resize(){var g=document.getElementById('game'),h=Math.min(window.innerHeight,900);g.style.height=h+'px';cv.width=W;cv.height=h;VIEWH=h;}
resize();window.addEventListener('resize',resize);
var now=Date.now();
// ========== СОСТОЯНИЕ ==========
var state='menu',score=0,best=parseInt(localStorage.getItem('neon_best')||'0',10),combo=0,comboTimer=0;
var dist=0,speed=0,t=0,spawnT=0,obstacles=[],coins=[],parts=[],rains=[];
var hero={x:210,y:0,vy:0,track:1,squash:0,sliding:false,dead:false,flash:0,runA:0};
var lives=3;
var TRACKS=[70,210,350],keys={},shake=0,slowmo=0,muted=false;
var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo');
var speedFill=document.getElementById('speedFill'),finalEl=document.getElementById('final'),finalSub=document.getElementById('finalSub');
var recEl=document.getElementById('rec'),muteBtn=document.getElementById('mute'),livesEl=document.getElementById('lives');bestEl.textContent=best;
// ========== ЗВУК ==========
var audio=null,musicOn=false;
function initAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function beep(f,d,type,g,slide){if(!audio||muted)return;try{var o=audio.createOscillator(),a=audio.createGain();
 o.type=type||'square';o.frequency.value=f;
 if(slide)o.frequency.exponentialRampToValueAtTime(slide,audio.currentTime+d);
 a.gain.setValueAtTime(g||0.05,audio.currentTime);a.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+d);
 o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+d);}catch(e){}}
function sfxCoin(n){var base=700+n*40;beep(base,0.09,'sine',0.045);setTimeout(function(){beep(base*1.5,0.1,'sine',0.04);},55);}
function sfxJump(){beep(300,0.12,'triangle',0.05,520);}
function sfxSlide(){beep(180,0.18,'sawtooth',0.05,90);}
function sfxHit(){beep(90,0.35,'sawtooth',0.09,40);setTimeout(function(){beep(60,0.4,'sawtooth',0.08,30);},90);}
function sfxRec(){[523,659,784,1046,1318].forEach(function(f,i){setTimeout(function(){beep(f,0.22,'sine',0.05);},i*120);});}
function sfxWall(){beep(200,0.1,'square',0.04,120);}
// Мини-бит: kick + hi-hat + бас
var beat=0,beatT=0;
function musicStep(dt){
 if(!audio||muted||state!=='play')return;
 beatT-=dt;if(beatT>0)return;
 beatT=0.28;beat++;
 var k=beat%2===0;
 if(k){beep(120,0.15,'sine',0.07,45);}
 beep(6000,0.02,'highpass',0.015);
 if(beat%4===0)beep(65,0.3,'sawtooth',0.03,55);
}
// ========== ЧАСТИЦЫ ==========
function burst(x,y,color,n,spread){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=60+Math.random()*(spread||240);
 parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.5+Math.random()*0.4,max:0.9,color:color,g:260});}}
function trail(x,y,color,vx){parts.push({x:x,y:y,vx:(vx||0)+(Math.random()-0.5)*40,vy:-30-Math.random()*60,life:0.32,max:0.32,color:color,g:120});}
function sparks(x,y,color){for(var i=0;i<6;i++){var a=Math.random()*6.283,v=140+Math.random()*220;
 parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.3+Math.random()*0.2,max:0.5,color:color,g:500});}}
// ========== СПАВН ==========
function spawn(){
 var r=Math.random();
 if(r<0.28){
  var tr=Math.floor(Math.random()*3);
  obstacles.push({type:'wall',tr:tr,y:-40,h:34+Math.random()*30});
 } else if(r<0.5){
  var tr2=Math.floor(Math.random()*3);
  obstacles.push({type:'laser',tr:tr2,y:-60});
 } else if(r<0.68){
  var tr3=Math.floor(Math.random()*3);
  obstacles.push({type:'barrier',tr:tr3,y:-40});
 } else {
  var tr4=Math.floor(Math.random()*3),n=3+Math.floor(Math.random()*3);
  for(var i=0;i<n;i++)coins.push({tr:tr4,y:-40-i*46});
 }
}
function reset(){
 score=0;combo=0;comboTimer=0;dist=0;speed=260;t=0;spawnT=0;obstacles=[];coins=[];parts=[];
 hero={x:210,y:0,vy:0,track:1,squash:0,sliding:false,dead:false,flash:0,runA:0};shake=0;slowmo=0;lives=3;
 scoreEl.textContent='0';comboEl.style.opacity='0';speedFill.style.width='0%';livesEl.textContent='❤️❤️❤️';
}
// ========== ОБНОВЛЕНИЕ ==========
function update(dt){
 t+=dt;speed=Math.min(720,260+t*13);dist+=speed*dt;
 speedFill.style.width=Math.round((speed-260)/460*100)+'%';
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(0.5,1.35-speed/1400);}
 musicStep(dt);
 if(slowmo>0){slowmo-=dt;dt*=0.35;}
 // герой
 var target=TRACKS[hero.track];hero.x+=(target-hero.x)*Math.min(1,dt*12);
 hero.vy-=1500*dt;hero.y+=hero.vy*dt;
 if(hero.y<=0){hero.y=0;hero.vy=0;hero.squash=Math.max(0,hero.squash-dt*3);}else hero.squash=1;
 if(hero.sliding&&hero.y>=40)hero.sliding=false;
 hero.runA+=dt*(10+speed/60);
 // шлейф
 if(Math.random()<dt*60)trail(hero.x+(Math.random()-0.5)*12,VIEWH-46-hero.y,Math.random()<0.5?'#3cd7ff':'#8a5cff');
 // препятствия
 for(var i=obstacles.length-1;i>=0;i--){
  var o=obstacles[i];o.y+=speed*dt;
  if(o.y>VIEWH+80){obstacles.splice(i,1);continue;}
  var ox=TRACKS[o.tr],oy=o.y,hit=false;
  var px=hero.x,py=VIEWH-46-hero.y;
  if(Math.abs(px-ox)<34){
   if(o.type==='wall'){if(hero.y<70)hit=true;}
   else if(o.type==='laser'){if(!hero.sliding)hit=true;}
   else hit=true;
  }
  if(hit){
   if(hero.flash<=0){
    lives--;
    if(lives<=0){burst(px,py,'#ff5070',26,360);sparks(px,py,'#ff8aa8');sfxHit();shake=0.6;slowmo=0.5;gameOver();}
    else {burst(px,py,'#ff5070',18,300);sparks(px,py,'#ff8aa8');sfxHit();shake=0.45;slowmo=0.35;
     hero.flash=0.6;combo=0;comboTimer=0;comboEl.style.opacity='0';livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);}
   }
  }
 }
 if(hero.flash>0)hero.flash-=dt;
 // монеты
 for(var j=coins.length-1;j>=0;j--){
  var c=coins[j];c.y+=speed*dt;
  if(c.y>VIEWH+40){coins.splice(j,1);continue;}
  var cx=TRACKS[c.tr],cy=c.y;
  var dx=hero.x-cx,dy=(VIEWH-46-hero.y)-cy;
  if(dx*dx+dy*dy<46*46){
   coins.splice(j,1);score+=10;combo++;comboTimer=1.5;
   burst(cx,cy,'#ffd75e',12,180);beep(500+combo*60,0.08,'sine',0.04);
   scoreEl.textContent=score;
   comboEl.textContent='🔥 КОМБО ×'+combo;
   comboEl.style.opacity='1';comboEl.classList.add('shine');
   setTimeout(function(){comboEl.classList.remove('shine');},120);
  }
 }
 if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=0;comboEl.style.opacity='0';}}
 // частицы
 for(var p=parts.length-1;p>=0;p--){
  var pt=parts[p];pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=pt.g*dt;
  if(pt.life<=0)parts.splice(p,1);
 }
 // дождь из света
 if(rains.length<26&&Math.random()<dt*30)rains.push({x:Math.random()*W,y:-20,len:40+Math.random()*60,sp:700+Math.random()*500,a:0.05+Math.random()*0.1});
 for(var q=rains.length-1;q>=0;q--){rains[q].y+=rains[q].sp*dt;if(rains[q].y>VIEWH)rains.splice(q,1);}
 if(shake>0)shake-=dt;
}
// ========== ОТРИСОВКА ==========
function draw(dt){
 // фон
 var g=ctx.createLinearGradient(0,0,0,VIEWH);
 g.addColorStop(0,'#070a1c');g.addColorStop(0.55,'#0d1028');g.addColorStop(1,'#131033');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,VIEWH);
 drawBack(dt);
 // дорожки с плиткой
 for(var k=0;k<3;k++){
  var tx=TRACKS[k];
  var tg=ctx.createLinearGradient(tx-46,0,tx+46,0);
  tg.addColorStop(0,'rgba(255,255,255,0)');tg.addColorStop(0.5,'rgba(60,215,255,.06)');tg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=tg;ctx.fillRect(tx-46,0,92,VIEWH);
  ctx.strokeStyle='rgba(60,215,255,.22)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(tx-46,0);ctx.lineTo(tx-46,VIEWH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(tx+46,0);ctx.lineTo(tx+46,VIEWH);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.05)';
  for(var yy=((t*speed*0.15)%44);yy<VIEWH;yy+=44){
   ctx.beginPath();ctx.moveTo(tx-40,yy);ctx.lineTo(tx+40,yy);ctx.stroke();
  }
 }
 // монеты
 for(var m=0;m<coins.length;m++){
  var c=coins[m],cx=TRACKS[c.tr],cy=c.y;
  var glow=ctx.createRadialGradient(cx,cy,2,cx,cy,24);
  glow.addColorStop(0,'rgba(255,215,94,.9)');glow.addColorStop(1,'rgba(255,215,94,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,24,0,6.283);ctx.fill();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(t*3+c.y*0.004);
  ctx.fillStyle='#ffd75e';ctx.beginPath();
  for(var hx=0;hx<6;hx++){var ang=hx/6*6.283;var rx=10,ry=12;
   var px2=Math.cos(ang)*rx,py2=Math.sin(ang)*ry;
   if(hx===0)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2);}
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(-2,-3,2.6,0,6.283);ctx.fill();
  ctx.restore();
 }
 // препятствия
 for(var n=0;n<obstacles.length;n++){
  var o=obstacles[n],ox=TRACKS[o.tr],oy=o.y;
  if(o.type==='wall'){
   var h=o.h;
   var wg=ctx.createLinearGradient(ox-34,0,ox+34,0);
   wg.addColorStop(0,'rgba(138,92,255,.15)');wg.addColorStop(0.5,'rgba(138,92,255,.38)');wg.addColorStop(1,'rgba(138,92,255,.15)');
   ctx.fillStyle=wg;ctx.fillRect(ox-34,oy-40,68,h+40);
   ctx.fillStyle='rgba(138,92,255,.9)';ctx.fillRect(ox-34,oy-40,4,h+40);ctx.fillRect(ox+30,oy-40,4,h+40);
   // верхняя кромка
   ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(ox-34,oy-40,68,3);
   ctx.fillStyle='#fff';ctx.fillRect(ox-20,oy-30,8,8);ctx.fillRect(ox+12,oy-30,8,8);
  } else if(o.type==='laser'){
   var ly=oy-26;
   var lg=ctx.createRadialGradient(ox,ly,2,ox,ly,60);
   lg.addColorStop(0,'rgba(255,77,109,.9)');lg.addColorStop(1,'rgba(255,77,109,0)');
   ctx.fillStyle=lg;ctx.beginPath();ctx.arc(ox,ly,60,0,6.283);ctx.fill();
   ctx.strokeStyle='rgba(255,77,109,.25)';ctx.lineWidth=18;
   ctx.beginPath();ctx.moveTo(ox-46,ly);ctx.lineTo(ox+46,ly);ctx.stroke();
   ctx.strokeStyle='#ff4d6d';ctx.lineWidth=5;
   ctx.beginPath();ctx.moveTo(ox-46,ly);ctx.lineTo(ox+46,ly);ctx.stroke();
   ctx.fillStyle='#ff4d6d';
   ctx.fillRect(ox-50,ly-5,8,10);ctx.fillRect(ox+42,ly-5,8,10);
   ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(ox-49,ly-2,6,4);ctx.fillRect(ox+43,ly-2,6,4);
  } else {
   ctx.fillStyle='rgba(60,215,255,.14)';ctx.fillRect(ox-42,oy-30,84,60);
   ctx.strokeStyle='rgba(60,215,255,.6)';ctx.lineWidth=2;
   ctx.strokeRect(ox-42,oy-30,84,60);
   ctx.fillStyle='#3cd7ff';
   for(var sp=-1;sp<=1;sp++){
    ctx.beginPath();ctx.moveTo(ox+sp*20-9,oy-10);ctx.lineTo(ox+sp*20+9,oy-10);ctx.lineTo(ox+sp*20,oy+14);ctx.closePath();ctx.fill();
   }
   ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(ox-42,oy-30,84,3);
  }
 }
 // тень героя
 var px=hero.x,py=VIEWH-46-hero.y;
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(px,VIEWH-8,26*Math.max(0.4,1-hero.y/220),5,0,0,6.283);ctx.fill();
 // герой-робот
 drawHero(px,py,dt);
 // частицы
 for(var p2=parts.length-1;p2>=0;p2--){
  var pt=parts[p2];
  ctx.globalAlpha=Math.max(0,pt.life/pt.max);
  ctx.fillStyle=pt.color;
  ctx.beginPath();ctx.arc(pt.x,pt.y,2.5+pt.life*4,0,6.283);ctx.fill();
  ctx.globalAlpha=1;
 }
 // дождь
 for(var q=0;q<rains.length;q++){
  var r=rains[q];
  ctx.strokeStyle='rgba(140,180,255,'+r.a+')';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-4,r.y+r.len);ctx.stroke();
 }
 // тряска экрана
 if(shake>0){ctx.save();ctx.translate((Math.random()-0.5)*12*shake,(Math.random()-0.5)*12*shake);}
 // виньетка
 var vg=ctx.createRadialGradient(W/2,VIEWH/2,VIEWH*0.35,W/2,VIEWH/2,VIEWH*0.95);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.4)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,VIEWH);
 if(shake>0)ctx.restore();
}
function drawHero(px,py,dt){
 // свечение
 var glow=ctx.createRadialGradient(px,py,2,px,py,52);
 glow.addColorStop(0,'rgba(120,230,255,.55)');glow.addColorStop(1,'rgba(120,230,255,0)');
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(px,py,52,0,6.283);ctx.fill();
 ctx.save();ctx.translate(px,py);
 var s=1+hero.squash*0.1;ctx.scale(s,2-s);
 var sliding=hero.sliding,air=hero.y>2;
 var leg=Math.sin(hero.runA)*0.65;
 // ноги
 ctx.fillStyle='#1b2440';
 if(sliding){ctx.fillRect(-15,2,12,6);ctx.fillRect(3,2,12,6);}
 else if(air){ctx.save();ctx.rotate(-0.5);ctx.fillRect(-14,-2,11,14);ctx.restore();ctx.save();ctx.rotate(0.35);ctx.fillRect(3,-4,11,14);ctx.restore();}
 else {ctx.fillRect(-15,0+leg*4,11,14);ctx.fillRect(4,0-leg*4,11,14);}
 // корпус
 var bg=ctx.createLinearGradient(0,-26,0,6);
 bg.addColorStop(0,'#2c3a66');bg.addColorStop(1,'#18224a');
 ctx.fillStyle=bg;
 ctx.beginPath();ctx.moveTo(-15,-20);ctx.lineTo(15,-20);ctx.lineTo(14,6);ctx.lineTo(-14,6);ctx.closePath();ctx.fill();
 // неоновые полосы
 ctx.fillStyle='#3cd7ff';ctx.fillRect(-12,-12,24,3);
 ctx.fillStyle='rgba(138,92,255,.9)';ctx.fillRect(-12,-7,24,2);
 // энергоядро
 var core=ctx.createRadialGradient(0,-2,1,0,-2,8);
 core.addColorStop(0,'#aef7ff');core.addColorStop(0.6,'#3cd7ff');core.addColorStop(1,'rgba(60,215,255,0)');
 ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,-2,8,0,6.283);ctx.fill();
 // голова/шлем
 var hg=ctx.createLinearGradient(0,-34,0,-20);
 hg.addColorStop(0,'#3c4f86');hg.addColorStop(1,'#243157');
 ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,-27,13,0,6.283);ctx.fill();
 ctx.fillStyle='#1b2440';ctx.fillRect(-13,-30,26,4);
 // визор
 ctx.fillStyle='#ffd75e';
 if(sliding){ctx.fillRect(-10,-28,20,4);}
 else {ctx.fillRect(-10,-29,20,5);ctx.fillRect(-10,-22,20,3);}
 // антенна
 ctx.strokeStyle='#8a5cff';ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(0,-40);ctx.lineTo(0,-46);ctx.stroke();
 ctx.fillStyle='#ffd75e';ctx.beginPath();ctx.arc(0,-48,2.5,0,6.283);ctx.fill();
 ctx.restore();
 // огонь из сопла при ускорении
 if(speed>420&&!hero.sliding){
  var fl=8+Math.random()*14;
  var fg=ctx.createLinearGradient(px,py+10,px,py+10+fl);
  fg.addColorStop(0,'rgba(140,230,255,.85)');fg.addColorStop(1,'rgba(60,215,255,0)');
  ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(px-6,py+12);ctx.lineTo(px+6,py+12);ctx.lineTo(px,py+12+fl);ctx.closePath();ctx.fill();
 }
}
function drawBack(dt){
 // дальние здания (слой 1)
 for(var i=0;i<9;i++){
  var bw=52,bh=110+((i*73)%190),bx=i*70-((t*28)%70),by=VIEWH-bh;
  if(bx>-60&&bx<W+60){
   ctx.fillStyle='#0e0d26';ctx.fillRect(bx,by,bw,bh);
   ctx.fillStyle='rgba(60,215,255,.45)';
   for(var yy=by+10;yy<VIEWH-16;yy+=17){
    for(var xx=bx+7;xx<bx+bw-9;xx+=15){
     if(((Math.floor(yy/17)+Math.floor(xx/15))%3)===0)ctx.fillRect(xx,yy,4,6);
    }
   }
  }
 }
 // средние здания (слой 2, ближе)
 for(var j=0;j<7;j++){
  var bw2=64,bh2=140+((j*91)%170),bx2=j*100-((t*50)%100)-30,by2=VIEWH-bh2;
  if(bx2>-80&&bx2<W+80){
   ctx.fillStyle='#141233';ctx.fillRect(bx2,by2,bw2,bh2);
   ctx.fillStyle='rgba(138,92,255,.5)';
   for(var yy2=by2+14;yy2<VIEWH-12;yy2+=22){
    ctx.fillRect(bx2+10,yy2,14,8);
    ctx.fillRect(bx2+38,yy2,14,8);
   }
   if(by2>VIEWH-340){ctx.fillStyle='rgba(255,215,94,.35)';ctx.fillRect(bx2+16,by2+8,18,5);}
  }
 }
 // неоновые антенны
 for(var a=0;a<5;a++){
  var ax=(a*112+((t*55)%112))%W;
  ctx.strokeStyle='rgba(138,92,255,.4)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(ax,VIEWH);ctx.lineTo(ax,VIEWH-280-(a%3)*90);ctx.stroke();
  ctx.fillStyle='rgba(255,90,120,.8)';ctx.fillRect(ax-3,VIEWH-280-(a%3)*90,6,9);
 }
 // туман
 ctx.fillStyle='rgba(80,70,180,.06)';
 for(var f=0;f<3;f++){
  var fx=((f*170+((t*12)%170))%W)-40;
  ctx.beginPath();ctx.ellipse(fx,VIEWH*(0.3+f*0.25),150,60,0,0,6.283);ctx.fill();
 }
}
// ========== ВВОД ==========
document.addEventListener('keydown',function(e){
 keys[e.code]=true;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0)e.preventDefault();
 if(state==='play'){
  if(e.code==='ArrowLeft'||e.code==='KeyA'){hero.track=Math.max(0,hero.track-1);sfxWall();}
  if(e.code==='ArrowRight'||e.code==='KeyD'){hero.track=Math.min(2,hero.track+1);sfxWall();}
  if(e.code==='ArrowUp'||e.code==='Space'){if(hero.y===0){hero.vy=540;hero.sliding=false;sfxJump();}}
  if(e.code==='ArrowDown'||e.code==='KeyS'){if(hero.y<40){hero.sliding=true;sfxSlide();}}
 }
 if(e.code==='KeyM'){muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';}
});
document.addEventListener('keyup',function(e){keys[e.code]=false;});
var touch=document.getElementById('touch');
touch.addEventListener('touchstart',function(e){
 if(state!=='play')return;
 var ev=e.touches[0],r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
 if(x<W/3){hero.track=Math.max(0,hero.track-1);sfxWall();}
 else if(x>W*2/3){hero.track=Math.min(2,hero.track+1);sfxWall();}
 else if(y<VIEWH/2){if(hero.y===0){hero.vy=540;hero.sliding=false;sfxJump();}}
 else {hero.sliding=true;sfxSlide();}
},{passive:true});
touch.addEventListener('touchend',function(){hero.sliding=false;});
touch.addEventListener('mousedown',function(e){
 if(state!=='play')return;
 var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(x<W/3){hero.track=Math.max(0,hero.track-1);sfxWall();}
 else if(x>W*2/3){hero.track=Math.min(2,hero.track+1);sfxWall();}
 else if(y<VIEWH/2){if(hero.y===0){hero.vy=540;hero.sliding=false;sfxJump();}}
 else {hero.sliding=true;sfxSlide();}
});
document.addEventListener('mouseup',function(){hero.sliding=false;});
muteBtn.addEventListener('click',function(){muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';});
// ========== ЦИКЛ ==========
var last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 var dt=Math.min((now-last)/1000,0.05);last=now;
 if(state==='play')update(dt);
 draw(dt);
}
document.getElementById('startBtn').addEventListener('click',function(){
 initAudio();reset();state='play';
 document.getElementById('startScreen').classList.add('hidden');
 document.getElementById('overScreen').classList.add('hidden');
 beep(440,0.15,'sine',0.05);beep(660,0.12,'sine',0.04);
});
document.getElementById('restartBtn').addEventListener('click',function(){
 reset();state='play';
 document.getElementById('overScreen').classList.add('hidden');
 beep(440,0.12,'sine',0.05);
});
function gameOver(){
 state='over';
 finalEl.textContent='💥 Разбился!';
 finalSub.textContent='Дистанция: '+Math.floor(dist)+' м · Счёт: '+score;
 var isRec=false;
 if(score>best){best=score;localStorage.setItem('neon_best',String(best));isRec=true;sfxRec();}
 bestEl.textContent=best;
 recEl.textContent=isRec?'🎉 НОВЫЙ РЕКОРД!':'Рекорд: '+best;
 document.getElementById('overScreen').classList.remove('hidden');
}
requestAnimationFrame(loop);
})();
</script>
